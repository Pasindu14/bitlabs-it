<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitlabs — Software Studio · Sri Lanka</title>
  <meta name="description" content="Bitlabs crafts innovative software solutions for businesses in Sri Lanka and beyond — mobile apps, web platforms, AI and custom software." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>
  <script>
    /* Hide one benign dev-only React key warning emitted from framer-motion's
       UMD internals on first mount. All other errors/warnings pass through. */
    (function () {
      var orig = console.error;
      console.error = function () {
        try {
          var msg = String(arguments[0] || "");
          var stack = Array.prototype.map.call(arguments, String).join(" ");
          if (msg.indexOf('unique "key"') !== -1 && stack.indexOf("framer-motion") !== -1) return;
        } catch (e) {}
        return orig.apply(console, arguments);
      };
    })();
  </script>

  <!-- React (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <!-- Framer Motion (UMD global: Motion) -->
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@11.18.2/dist/framer-motion.js"></script>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lenis smooth scroll -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tweaks panel mount point (decoupled from main React root) -->
  <div id="tweaks-root"></div>

  <!-- App -->
  <script type="text/babel" src="components-core.jsx"></script>
  <script type="text/babel" src="components-mid.jsx"></script>
  <script type="text/babel" src="components-end.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="tweaks.jsx"></script>
</body>
</html>
